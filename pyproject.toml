[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsl-port"
version = "1.0.0"
description = "WSL Manager + Port Forwarding integrados - publica tu WSL en Internet en 1 clic"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ttkbootstrap>=1.10",
    "pystray>=0.19",
    "Pillow>=10",
    "psutil>=5.9",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "winotify>=1.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["pystray>=0.19", "Pillow>=10", "ttkbootstrap>=1.10", "winotify>=1.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic-settings>=2.2"]
mcp = ["mcp>=1.0"]

[project.scripts]
wsl-port = "wsl_port.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wsl_port*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
